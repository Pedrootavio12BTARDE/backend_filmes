<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Filme</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button { padding: 10px; font-size: 14px; }
    button { background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
    a { display: inline-block; margin-top: 20px; text-decoration: none; color: #007bff; }
  </style>
</head>
<body>

  <h2>Cadastrar Novo Filme</h2>

  <form id="form-cadastro">
    <input type="text" id="titulo" placeholder="Título do Filme" required>
    <input type="text" id="genero" placeholder="Gênero" required>
    <input type="text" id="classificacao" placeholder="Classificação (ex: 12 anos)" required>
    <input type="number" id="duracao" placeholder="Duração (minutos)" required>
    <button type="submit">Cadastrar Filme</button>
  </form>

  <a href="index.html">← Voltar para o Catálogo</a>

  <script src="cadastro.js"></script>
</body>
</html>
