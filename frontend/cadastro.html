<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Filme</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 20px; }
    .menu { display: flex; gap: 10px; margin-bottom: 25px; }
    .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; }
    .btn-menu { background-color: #007bff; color: white; }
    .btn-cadastrar { background-color: #28a745; color: white; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button[type="submit"] { padding: 10px; font-size: 14px; }
    button[type="submit"] { background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Menu de Navegação -->
  <div class="menu">
    <a href="index.html" class="btn btn-menu">📊 Ver Tabela de Filmes</a>
    <a href="cadastro.html" class="btn btn-cadastrar">➕ Cadastrar Novo Filme</a>
  </div>

  <h1>Cadastrar Novo Filme</h1>

  <form id="form-cadastro">
    <input type="text" id="titulo" placeholder="Título do Filme" required>
    <input type="text" id="genero" placeholder="Gênero" required>
    <input type="text" id="classificacao" placeholder="Classificação (ex: 12 anos)" required>
    <input type="number" id="duracao" placeholder="Duração (minutos)" required>
    <button type="submit">Salvar Filme</button>
  </form>

  <script>
    const API_URL = "http://localhost:3333/filmes"

    document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
      e.preventDefault()

      const novoFilme = {
        titulo: document.getElementById("titulo").value,
        genero: document.getElementById("genero").value,
        classificacao_indicativa: document.getElementById("classificacao").value,
        duracao: Number(document.getElementById("duracao").value)
      }

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(novoFilme)
      })

      if (res.ok) {
        alert("Filme cadastrado com sucesso!")
        window.location.href = "index.html" // Vai direto para a tabela após salvar
      } else {
        alert("Erro ao cadastrar filme.")
      }
    })
  </script>
</body>
</html>
