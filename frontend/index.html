<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo - Tabela de Filmes</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .menu { display: flex; gap: 10px; margin-bottom: 25px; }
    .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; }
    .btn-menu { background-color: #007bff; color: white; }
    .btn-cadastrar { background-color: #28a745; color: white; }
    .btn-deletar { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

  <!-- Menu de Navegação -->
  <div class="menu">
    <a href="index.html" class="btn btn-menu">📊 Ver Tabela de Filmes</a>
    <a href="cadastro.html" class="btn btn-cadastrar">➕ Cadastrar Novo Filme</a>
  </div>

  <h1>Tabela de Filmes</h1>

  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Gênero</th>
        <th>Classificação</th>
        <th>Duração</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-filmes"></tbody>
  </table>

  <script>
    const API_URL = "http://localhost:3333/filmes"

    async function carregarFilmes() {
      try {
        const response = await fetch(API_URL)
        const filmes = await response.json()
        
        const tbody = document.getElementById("tabela-filmes")
        tbody.innerHTML = ""

        filmes.forEach(filme => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${filme.titulo}</strong></td>
              <td>${filme.genero}</td>
              <td>${filme.classificacao_indicativa}</td>
              <td>${filme.duracao} min</td>
              <td>
                <button class="btn-deletar" onclick="deletarFilme(${filme.id})">Excluir</button>
              </td>
            </tr>
          `
        })
      } catch (error) {
        console.error("Erro ao carregar os filmes:", error)
      }
    }

    async function deletarFilme(id) {
      if (confirm("Deseja apagar este filme?")) {
        await fetch(`${API_URL}/${id}`, { method: "DELETE" })
        carregarFilmes()
      }
    }

    carregarFilmes()
  </script>
</body>
</html>
