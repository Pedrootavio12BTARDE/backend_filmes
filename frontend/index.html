<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Filmes</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    input, button { padding: 10px; font-size: 14px; }
    button { cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    .filme-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .btn-deletar { background-color: #dc3545; }
  </style>
</head>
<body>

  <h1>Catálogo de Filmes</h1>

  <!-- Formulário de Cadastro -->
  <form id="form-filme">
    <input type="text" id="titulo" placeholder="Título do filme" required>
    <input type="text" id="genero" placeholder="Gênero" required>
    <input type="text" id="classificacao" placeholder="Classificação (ex: 12 anos)" required>
    <input type="number" id="duracao" placeholder="Duração em minutos" required>
    <button type="submit">Cadastrar Filme</button>
  </form>

  <!-- Lista onde os filmes serão exibidos -->
  <div id="lista-filmes"></div>

  <script>
    const API_URL = "http://localhost:3333/filmes"

    // Funcao para carregar todos os filmes
    async function carregarFilmes() {
      const response = await fetch(API_URL)
      const filmes = await response.json()
      
      const container = document.getElementById("lista-filmes")
      container.innerHTML = ""

      filmes.forEach(filme => {
        container.innerHTML += `
          <div class="filme-card">
            <div>
              <strong>${filme.titulo}</strong> (${filme.genero})<br>
              <small>Classificação: ${filme.classificacao_indicativa} | Duração: ${filme.duracao} min</small>
            </div>
            <button class="btn-deletar" onclick="deletarFilme(${filme.id})">Excluir</button>
          </div>
        `
      })
    }

    // Funcao para cadastrar filme via POST
    document.getElementById("form-filme").addEventListener("submit", async (event) => {
      event.preventDefault()

      const novoFilme = {
        titulo: document.getElementById("titulo").value,
        genero: document.getElementById("genero").value,
        classificacao_indicativa: document.getElementById("classificacao").value,
        duracao: Number(document.getElementById("duracao").value)
      }

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(novoFilme)
      })

      document.getElementById("form-filme").reset()
      carregarFilmes()
    })

    // Funcao para deletar filme via DELETE
    async function deletarFilme(id) {
      await fetch(`${API_URL}/${id}`, { method: "DELETE" })
      carregarFilmes()
    }

    // Carrega a lista assim que abre a página
    carregarFilmes()
  </script>
</body>
</html>
