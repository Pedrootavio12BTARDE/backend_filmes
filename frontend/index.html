<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Filmes</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-cadastrar { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; text-decoration: none; font-weight: bold; }
    .btn-deletar { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Catálogo de Filmes</h1>
    <a href="cadastro.html" class="btn-cadastrar">+ Cadastrar Novo Filme</a>
  </div>

  <!-- Tabela de exibição dos filmes -->
  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Gênero</th>
        <th>Classificação</th>
        <th>Duração</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-filmes"></tbody>
  </table>

  <script>
    const API_URL = "http://localhost:3333/filmes"

    // Carrega e exibe os filmes do banco assim que entra na página
    async function carregarFilmes() {
      try {
        const response = await fetch(API_URL)
        const filmes = await response.json()
        
        const tbody = document.getElementById("tabela-filmes")
        tbody.innerHTML = ""

        filmes.forEach(filme => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${filme.titulo}</strong></td>
              <td>${filme.genero}</td>
              <td>${filme.classificacao_indicativa}</td>
              <td>${filme.duracao} min</td>
              <td>
                <button class="btn-deletar" onclick="deletarFilme(${filme.id})">Excluir</button>
              </td>
            </tr>
          `
        })
      } catch (error) {
        console.error("Erro ao carregar filmes:", error)
      }
    }

    // Função para deletar um filme
    async function deletarFilme(id) {
      if (confirm("Deseja realmente excluir este filme?")) {
        await fetch(`${API_URL}/${id}`, { method: "DELETE" })
        carregarFilmes()
      }
    }

    // Executa a busca ao abrir a página
    carregarFilmes()
  </script>
</body>
</html>
